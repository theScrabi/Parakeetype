AutoName: Parakeetype

Summary: On-device speech-to-text keyboard using Parakeet ASR

Description: |-
  Parakeetype is a speech-to-text keyboard (IME) that transcribes your voice
  entirely on-device using the NVIDIA Parakeet ASR model via ONNX Runtime.

  No audio leaves the device. No account is required. No Google Play Services
  or any third-party telemetry libraries are used.

  The app has no internet permission. The model file (~700 MB) is downloaded
  once in your browser and imported into the app, which then stores it locally.

  Requires Android 12 (API 31) or higher.

Repo: https://github.com/theScrabi/Parakeetype.git
RepoType: git

CurrentVersion: '0.3.1'
